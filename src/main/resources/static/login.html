<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>채팅 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <style>
        body {
          font-family: "Inter", sans-serif;
        }
        /* 에러 메시지 텍스트가 표시될 때 높이가 변하지 않도록 최소 높이 설정 */
        #error-message {
          min-height: 1.25rem; /* text-sm의 line-height와 유사하게 설정 */
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="w-full max-w-md p-8 space-y-6 bg-white rounded-xl shadow-lg">
    <div class="text-center">
        <h1 class="text-3xl font-bold text-gray-900">로그인</h1>
        <p class="mt-2 text-sm text-gray-600">
            채팅에 참여하려면 로그인하세요.
        </p>
    </div>

    <form id="login-form" class="space-y-6">
        <div>
            <label for="loginId" class="text-sm font-medium text-gray-700"
            >아이디</label
            >
            <input
                    type="text"
                    id="loginId"
                    name="loginId"
                    required
                    class="w-full px-3 py-2 mt-1 text-gray-900 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
            />
        </div>

        <div>
            <label for="password" class="text-sm font-medium text-gray-700"
            >비밀번호</label
            >
            <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    class="w-full px-3 py-2 mt-1 text-gray-900 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
            />
        </div>

        <div>
            <p id="error-message" class="text-sm text-red-600 text-center"></p>
        </div>
        <div>
            <button
                    type="submit"
                    class="w-full px-4 py-2 text-lg font-semibold text-white bg-blue-600 rounded-md shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform hover:scale-105"
            >
                로그인
            </button>
        </div>
    </form>

    <p class="text-sm text-center text-gray-600">
        계정이 없으신가요?
        <a
                href="join"
                class="font-medium text-blue-600 hover:text-blue-500 hover:underline"
        >회원가입</a
        >
    </p>
</div>

<script>
    const loginForm = document.getElementById("login-form");
    // 에러 메시지를 표시할 <p> 태그를 선택합니다.
    const errorMessage = document.getElementById("error-message");

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      // 1. 요청 전에 이전 에러 메시지를 초기화합니다.
      errorMessage.textContent = "";

      const loginId = document.getElementById("loginId").value;
      const password = document.getElementById("password").value;

      // [수정] JSON 대신 폼 데이터 형식으로 변환
      const formData = new URLSearchParams();
      formData.append('loginId', loginId);
      formData.append('password', password);

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded", // [수정] Content-Type 변경
          },
          body: formData, // [수정] body 변경
        });

        // 2. 서버 내부 오류(500번대)인 경우, 에러 페이지로 리다이렉트합니다.
        if (response.status >= 500) {
          console.error(
            "서버 내부 오류가 발생했습니다:",
            response.statusText
          );
          // '/error'는 실제 에러 페이지 경로로 변경하세요.
          window.location.href = "/error";
          return; // 함수 실행 중단
        }

        if (response.ok) {
          // 4. [수정] 로그인 성공: 세션 방식이므로 토큰 저장 없이 메인 페이지로 이동
          window.location.href = "/chat";
        } else {
          // 5. [수정] 로그인 실패 (4xx 오류): alert 대신 <p> 태그에 메시지 표시
          // 서버가 JSON 에러 메시지를 주지 않을 수 있으므로 고정 메시지 사용
          errorMessage.textContent = "아이디 또는 비밀번호가 올바르지 않습니다.";
        }
      } catch (error) {
        // 6. [수정] 네트워크 오류 등: alert 대신 에러 페이지로 리다이렉트
        console.error("로그인 요청 중 네트워크 오류가 발생했습니다:", error);
        // '/error'는 실제 에러 페이지 경로로 변경하세요.
        window.location.href = "/error";
      }
    });
</script>
</body>
</html>
