version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: chat-redis
    restart: always
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:latest
    container_name: chat-mongo
    restart: always
    ports:
      - "27016:27017"
    volumes:
      - ./data/mongo:/data/db
    command:
      - --profile=1       # 느린 쿼리만 기록 (Level 1)
      - --slowms=100      # 100ms(0.1초) 이상 걸리면 기록

  mysql:
    image: mysql:8.0
    container_name: chat-mysql
    restart: always
    environment:
      # [변경] .env 파일의 DB_PASSWORD 값을 가져옵니다.
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: chat
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --slow_query_log=1                # 1. 슬로우 쿼리 로그 켜기 (ON)
      - --long_query_time=2               # 2. '2초' 이상 걸리면 기록 (원하는 시간 설정)
      - --slow_query_log_file=/var/lib/mysql/slow.log # 3. 저장할 파일 위치
    volumes:
      - ./data/mysql:/var/lib/mysql

  prometheus:
    image: prom/prometheus:latest
    container_name: chat-prometheus
    ports:
      - "9090:9090"
    volumes:
      # 아까 만든 설정 파일을 컨테이너 안으로 넣어줍니다.
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # [추가] 수집한 데이터를 내 컴퓨터에 저장 (과거 기록 보존)
      - ./prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: always

  # [추가] 그라파나 (대시보드 뷰어)
  grafana:
    image: grafana/grafana:latest
    container_name: chat-grafana
    ports:
      - "3000:3000" # 접속 포트
    environment:
      # 로그인 없이 바로 보고 싶다면 설정 (보안상 비추천하지만 개발용으론 편함)
      - GF_AUTH_ANONYMOUS_ENABLED=true
      # [추가] 2. 익명 사용자의 권한을 'Admin'으로 격상 (이게 핵심!)
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    #     - GF_SECURITY_ADMIN_PASSWORD=admin # 초기 비번 설정
    restart: always
    volumes:
      - ./grafana-data:/var/lib/grafana

  my-chat-app:
    build: .
    image: my-chat-app:latest
    container_name: my-chat-app
    depends_on:
      - prometheus # [변경] scouter 대신 prometheus
      - mysql
    ports:
      - "8080:8080"
    volumes:
      - ./scouter-agent:/app/scouter-agent

    # [추가] .env 파일의 모든 변수를 컨테이너로 주입합니다.
    env_file:
      - .env

    environment:
      # 1. MySQL 접속 정보 (컨테이너 이름 chat-mysql 사용)
      - SPRING_DATASOURCE_URL=jdbc:mysql://chat-mysql:3306/chat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD} # .env에서 비번 가져옴

      # 2. Redis 접속 정보 (컨테이너 이름 chat-redis 사용)
      - SPRING_DATA_REDIS_HOST=chat-redis
      - SPRING_DATA_REDIS_PORT=6379

      # 3. MongoDB 접속 정보 (컨테이너 이름 chat-mongo 사용)
      - SPRING_DATA_MONGODB_URI=mongodb://chat-mongo:27017/chat
